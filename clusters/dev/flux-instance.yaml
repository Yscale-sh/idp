# clusters/dev/flux-instance.yaml — the ONE hand-written object per cluster.
#
# Applied once at bringup (after installing the Flux Operator); everything else
# in clusters/dev/ is generated by `idpctl render` / `idpctl infra render` and
# reconciled by Flux from git. sync.url must match environments/dev/cluster.yaml
# flux.repoURL — point both at YOUR fork.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "1h"
spec:
  distribution:
    version: "2.x"
    registry: "ghcr.io/fluxcd"
  components:
    - source-controller
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
  sync:
    kind: GitRepository
    url: "https://github.com/yscale-sh/idp.git"
    ref: "refs/heads/main"
    path: "clusters/dev"
    pullSecret: "github-auth"   # created out-of-band: flux-system Secret with repo credentials
