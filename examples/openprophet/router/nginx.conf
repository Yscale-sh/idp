events {
  worker_connections 1024;
}

http {
  # Cross-namespace upstreams (see cartogopher router). openprophet.io fans / to the
  # api and /data/* to the datastream, preserving the live URL contract.
  upstream openprophet {
    server openprophet-api.openprophet-prod-api.svc.cluster.local:3738;
  }
  upstream openprophet_datastream {
    server openprophet-datastream.openprophet-prod-datastream.svc.cluster.local:2222;
  }

  # Send "Connection: upgrade" ONLY for real websocket requests (the legacy hardcoded
  # `Connection 'upgrade'` makes the API hang on every normal request).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Security headers (preserved from the legacy conf)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  server {
    listen 80 default_server;
    server_name openprophet.io www.openprophet.io;

    # Block admin + webhook endpoints from the public — only openprophet-api should
    # take Stripe webhooks; admin minting is cluster-internal only.
    location /data/v1/admin/ { return 404; }
    location /data/v1/webhooks/ { return 404; }

    # Data Stream API — proxy /data/* to openprophet-datastream, stripping the /data
    # prefix (trailing slash on the upstream URL does the rewrite).
    location /data/ {
      proxy_pass http://openprophet_datastream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else -> openprophet-api (ws upgrade + cookie passthrough)
    location / {
      proxy_pass http://openprophet;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Cookie $http_cookie;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
