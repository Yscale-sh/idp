# Yscale scanner worker — media scan + TMDB match. No web tier (a portless worker).
# SHARES the api's Postgres + Redis (provision: false). Same image as the api.
#   idpctl render --env dev --file yscale-scanner.deploy.yaml --image ghcr.io/jakenesler/yscale-media-api:<tag>
app: yscale-media
component: scanner

runtime:
  image: ghcr.io/jakenesler/yscale-media-api
  port: 0            # worker: no inbound Service / probes / ServiceMonitor

env:
  YSCALE_ROLE: scanner
  RUST_LOG: info
  YSCALE_METADATA_DIR: /metadata   # writes posters/backdrops the api serves at /images

sizing:
  # The scanner buffers every file's ffprobe output in memory before the batch
  # insert, so the default `minimal` (256Mi) OOMKilled it mid-scan. `large` =
  # 2Gi limit; `autosize` then lets the VPA right-size requests/limits within
  # that envelope from real scan usage (updateMode Initial — applied at pod
  # creation, no mid-scan eviction) instead of hand-tuning.
  profile: large
  replicas: 1
  autosize: true

# Share the SAME stores the api provisions — wire the URLs, provision nothing.
db:
  - name: primary
    type: postgres
    provision: false
cache:
  - name: events
    type: redis
    provision: false

volumes:
  - name: media
    type: nfs
    server: 10.0.0.236
    path: /volume/f24160d1-3f63-4889-ac56-c892dc01f76c/.srv/.unifi-drive/nfs/.data
    mountPath: /mnt/personal-drive
    readOnly: true
  - name: metadata        # writes posters/backdrops the api serves
    type: nfs
    server: 10.0.0.236
    path: /volume/f24160d1-3f63-4889-ac56-c892dc01f76c/.srv/.unifi-drive/nfs/.data
    subPath: .yscale-metadata
    mountPath: /metadata
  # Provisioned persistent scratch — the platform creates this PVC (ReadWriteOnce,
  # data kept across redeploys). Note the dev surface: just name + size + mountPath,
  # no k8s 'type: pvc' jargon.
  - name: scan-cache
    size: 2Gi
    mountPath: /var/cache/yscale
