# Yscale API — REST + WebSocket + in-process stream/transcode (the web tier).
# On-prem / LAN only: no public route, no Cloudflare. The UI proxies to it in-cluster.
#   idpctl render --env dev --file yscale-api.deploy.yaml --image ghcr.io/jakenesler/yscale-media-api:<tag>
app: yscale-media
component: api

runtime:
  image: ghcr.io/jakenesler/yscale-media-api
  port: 8000

# Build: the backend image vendors the Rust transcoder as a PRIVATE git submodule,
# so the platform initializes it before building (without this the cargo build
# fails: vendor/yscale-transcode/Cargo.toml not found). The scanner builds from
# this same image; the platform builds it once.
build:
  submodules:
    - vendor/yscale-transcode

# Yscale's API serves on :8000 but has no /healthz route, so a TCP port-open check
# instead of the default HTTP probe (otherwise the liveness probe SIGKILLs it →
# CrashLoopBackOff exit 137). VERIFIED on the live cluster.
probes:
  type: tcp

# Same backend image as the scanner; YSCALE_ROLE selects the web tier.
env:
  YSCALE_ROLE: web
  RUST_LOG: info
  YSCALE_METADATA_DIR: /metadata   # shared-NFS posters; api serves them at /images
  YSCALE_CACHE_DIR: /transcode     # ephemeral per-pod DASH segment cache
  # Hardware (VAAPI/iGPU) transcode ON by default — software x264 of a 4K HDR disc
  # runs below real-time and starves the player's buffer.
  YSCALE_HWACCEL: "true"
  # Trusted-LAN: serve every request as the admin user, no login (homelab only).
  YSCALE_DISABLE_AUTH: "true"
  # Stable token-signing key so sessions survive restarts/scale (else DecryptError).
  # Dev/LAN-only — TODO: move to a sealed Secret / externalSecret.
  YSCALE_SECRET_KEY: "REPLACE_ME_32B_HEX"          # dev placeholder — supply via a Secret/externalSecret
  # Sharded transcoding: the api is the COORDINATOR — it chunk-plans streams, enqueues
  # work onto the Redis queue, and builds the S3-backed `/sharded.mpd`. The worker pool
  # (yscale-transcode.deploy.yaml) does the encoding. The api still also does in-process
  # transcode for the legacy /manifest path, so this stays additive.
  YSCALE_TRANSCODE_MODE: sharded
  # Sharded windowing + lifecycle — all driveable via config (yscale-core sharded.rs):
  #   WINDOW_CHUNKS  : only enqueue this many chunks (~16s each) ahead of the playhead
  #                    — the "cooldown depth": when playback stops the window stops
  #                    advancing and workers idle after draining it. 0 = whole file.
  #   COOLDOWN_SECS  : the coordinator reaper cancels a stream's *pending* chunks this
  #                    many seconds after its last playhead update (playback stopped).
  #   SEGMENT_TTL_SECS: evict a media's object-store segments this many seconds after
  #                    it goes cold (re-encoded on demand if watched again). 0 = keep.
  YSCALE_SHARD_WINDOW_CHUNKS: "8"
  YSCALE_SHARD_COOLDOWN_SECS: "120"
  YSCALE_SEGMENT_TTL_SECS: "1800"
  # MinIO (infrastructure/onprem/yscale-minio): ENDPOINT in-cluster; PUBLIC_BASE is
  # the MetalLB LAN IP baked into the manifest's <BaseURL> so LAN clients GET segments.
  YSCALE_S3_ENDPOINT: http://minio.yscale-minio.svc:9000
  YSCALE_S3_PUBLIC_BASE: http://10.0.0.211:9000
  YSCALE_S3_BUCKET: yscale-transcode
  YSCALE_S3_ACCESS_KEY: yscaleadmin
  YSCALE_S3_SECRET_KEY: "REPLACE_ME"                 # dev placeholder — supply via a Secret      # TODO: move to a sealed Secret

sizing:
  # xlarge (4Gi ceiling): the api transcodes 4K HDR in-process. Fixed (NOT
  # autosized) — transcode memory is spiky, so a generous fixed ceiling avoids a
  # mid-stream OOM that VPA's Initial mode (sizes at pod creation) wouldn't catch.
  profile: xlarge
  # MUST stay 1 until the transcode-worker split: the api transcodes in-process
  # (needs the iGPU + a sticky DASH-segment cache), so it can't scale yet.
  replicas: 1
  # Intel iGPU for VAAPI/QSV hardware transcode (i915 device-plugin shared mode).
  extraLimits:
    gpu.intel.com/i915: "1"

# Postgres + Redis are PROVISIONED here (the scanner shares them via provision:false).
db:
  - name: primary
    type: postgres
cache:
  - name: events          # pub/sub event bus
    type: redis

volumes:
  # Media library (read-only) via the FS-Cache PVC: routes the transcode read path
  # through cachefilesd's NVMe tier on the optiplex node (the api is pinned there by
  # the iGPU), so media reads land on NVMe after first touch — faster transcode
  # start/seeks, less NAS traffic. The PV (infra: onprem/media/yscale-media.yaml)
  # carries mountOptions [vers=3, hard, fsc, nosharecache]; `nosharecache` keeps
  # `fsc` from being dropped via NFS-superblock sharing with the metadata mount.
  # The api NEVER writes media (the scanner owns artwork via the Redis fetch queue).
  - name: media
    type: pvc
    claim: yscale-media-nfs
    mountPath: /mnt/personal-drive
    readOnly: true
  # Metadata: posters/backdrops the SCANNER writes and the api serves at /images.
  - name: metadata
    type: nfs
    server: 10.0.0.236
    path: /volume/f24160d1-3f63-4889-ac56-c892dc01f76c/.srv/.unifi-drive/nfs/.data
    subPath: .yscale-metadata
    mountPath: /metadata
  # Transcode cache (ephemeral, per-pod).
  - name: transcode
    type: emptyDir
    mountPath: /transcode
