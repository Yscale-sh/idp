# Yscale sharded-transcode GPU worker — pulls chunk jobs off the Redis queue,
# encodes each timeline slice with the iGPU (VAAPI), and uploads fMP4 segments to
# MinIO. A PORTLESS worker (like the scanner); SHARES the api's Postgres + Redis
# (provision: false). Same image as the api; YSCALE_ROLE=transcode selects it.
#
# THIS is the horizontal scale-out: each pod drains the queue independently, so one
# stream is transcoded across many pods. The iGPU request implicitly pins pods to
# `optiplex` (the only i915 node); the device-plugin's SHARED mode lets several
# replicas share the one iGPU.
#
# GPU-SPEND GATE: replicas starts at 0 so standing up the stack costs no GPU. Run
# the burst by scaling up:
#   kubectl -n yscale-media-<env>-transcode scale deploy/<name> --replicas=3
# (or let KEDA do it on queue depth — yscale-transcode-keda.yaml).
#   idpctl render --env dev --file yscale-transcode.deploy.yaml --image ghcr.io/jakenesler/yscale-media-api:<tag>
app: yscale-media
component: transcode

runtime:
  image: ghcr.io/jakenesler/yscale-media-api
  port: 0            # worker: no inbound Service / probes

env:
  YSCALE_ROLE: transcode
  YSCALE_TRANSCODE_MODE: sharded
  RUST_LOG: info
  YSCALE_CACHE_DIR: /transcode      # ephemeral per-pod scratch for in-flight segments
  # GPU (VAAPI/iGPU) transcode — the real worker for the burst. (For a CPU pool
  # instead: set "false" and drop the i915 extraLimit below.)
  YSCALE_HWACCEL: "true"
  # Object store (MinIO, infrastructure/onprem/yscale-minio). ENDPOINT is in-cluster
  # (workers upload here); PUBLIC_BASE is the MetalLB LAN IP the CLIENT GETs segments
  # from. Bucket is public-read (LAN trust model).
  YSCALE_S3_ENDPOINT: http://minio.yscale-minio.svc:9000
  YSCALE_S3_PUBLIC_BASE: http://10.0.0.211:9000
  YSCALE_S3_BUCKET: yscale-transcode
  YSCALE_S3_ACCESS_KEY: yscaleadmin
  YSCALE_S3_SECRET_KEY: "REPLACE_ME"                 # dev placeholder — supply via a Secret      # TODO: move to a sealed Secret

sizing:
  # large (2Gi): hardware transcode is memory-spiky. Fixed (no autosize).
  profile: large
  # Gated at 0 — scale up (or let KEDA) for the burst so no GPU is spent at rest.
  replicas: 0
  # Intel iGPU (i915 shared mode) — implicitly pins to optiplex and enables VAAPI.
  extraLimits:
    gpu.intel.com/i915: "1"

# Share the SAME stores the api provisions — wire the URLs, provision nothing.
db:
  - name: primary
    type: postgres
    provision: false
cache:
  - name: events
    type: redis
    provision: false

volumes:
  # Source media (read-only) — workers ffprobe + read the original file to encode.
  - name: media
    type: nfs
    server: 10.0.0.236
    path: /volume/f24160d1-3f63-4889-ac56-c892dc01f76c/.srv/.unifi-drive/nfs/.data
    mountPath: /mnt/personal-drive
    readOnly: true
  # In-flight segment scratch (ephemeral; the durable copy lands in MinIO).
  - name: transcode
    type: emptyDir
    mountPath: /transcode
