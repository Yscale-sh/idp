events {
  worker_connections 1024;
}

http {
  # anyrent family is HOST-based (not path-based): the cloudflared sidecar forwards
  # every tunnel host to localhost:80 and this nginx routes by server_name. Faithful
  # translation of the legacy LKE anyrent-ui vhosting (which fanned .com/.io/sign/esign
  # to the four backend services), expressed here because idp routing is host->one-svc.
  upstream ui        { server anyrent-ui.anyrent-prod-ui.svc.cluster.local:3000; }
  upstream api       { server anyrent-api.anyrent-prod-api.svc.cluster.local:8080; }
  upstream documenso { server documenso-app.documenso-prod-app.svc.cluster.local:3000; }
  upstream signing   { server anyrent-signing-app.anyrent-signing-prod-app.svc.cluster.local:3002; }

  # "Connection: upgrade" ONLY for real websocket requests (else the upstream hangs
  # on normal requests waiting for a ws handshake — the cartogopher router lesson).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # CF terminates TLS; tell the origins the public scheme is https (cookies/redirects).
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  client_max_body_size 50m;          # documenso PDF uploads / signed files

  # anyrentcloud.com (+www) -> UI
  server {
    listen 80;
    server_name anyrentcloud.com www.anyrentcloud.com;
    location / { proxy_pass http://ui; proxy_cache_bypass $http_upgrade; }
  }

  # anyrentcloud.io (+www) IS the public API host -> API
  server {
    listen 80;
    server_name anyrentcloud.io www.anyrentcloud.io;
    location / { proxy_pass http://api; proxy_cache_bypass $http_upgrade; }
  }

  # sign.anyrentcloud.com -> documenso (self-hosted e-signature)
  server {
    listen 80;
    server_name sign.anyrentcloud.com;
    location / { proxy_pass http://documenso; proxy_cache_bypass $http_upgrade; }
  }

  # esign.anyrentcloud.com -> anyrent-signing (the documenso bridge service)
  server {
    listen 80;
    server_name esign.anyrentcloud.com;
    location / { proxy_pass http://signing; proxy_cache_bypass $http_upgrade; }
  }

  # unknown host (cloudflared only forwards the configured ones, but be strict)
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }
}
