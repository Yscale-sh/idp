{{- $env := .Values.env -}}
{{- range .Values.apps }}
---
# app: {{ .name }} -> its own HelmRelease (chart ./charts/app) in {{ .namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .name "app" .name "env" $env "component" (.component | default "app")) | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .releaseName }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
  {{- include "cluster.remediation" . | nindent 2 }}
  chart:
    spec:
      chart: ./charts/app
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .values | nindent 4 }}
{{- $app := .name -}}
{{- range .stores }}
---
# {{ $app }}'s dedicated dev {{ .tool }} -> its own HelmRelease ({{ .chart }}) in {{ .namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .releaseName "app" $app "env" $env "component" .tool) | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .releaseName }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
  {{- include "cluster.remediation" $ | nindent 2 }}
  chart:
    spec:
      chart: {{ .chart }}
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .values | nindent 4 }}
{{- end }}
{{- end }}
