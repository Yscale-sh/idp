{{- $env := .Values.env -}}
{{- range .Values.apps }}
---
# app: {{ .name }} -> its own HelmRelease (chart ./charts/app) in {{ .namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .name "app" .name "env" $env "component" (.component | default "app")) | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .releaseName }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
  {{- include "cluster.appRemediation" (dict "env" $env) | nindent 2 }}
  chart:
    spec:
      chart: ./charts/app
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .values | nindent 4 }}
{{- $app := .name -}}
{{- range .stores }}
---
# {{ $app }}'s dedicated dev {{ .tool }} -> its own HelmRelease ({{ .chart }}) in {{ .namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .releaseName "app" $app "env" $env "component" .tool) | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .releaseName }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
  {{- include "cluster.remediation" $ | nindent 2 }}
  chart:
    spec:
      chart: {{ .chart }}
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .values | nindent 4 }}
{{- end }}
{{- /* BACK-COMPAT: an app entry written by an OLDER idpctl carries a single
.postgres block instead of .stores[]. Render it too so a chart upgrade doesn't
prune an existing app's Postgres before its entry is re-rendered into .stores. */}}
{{- if and .postgres .postgres.enabled }}
---
# {{ $app }}'s dedicated dev Postgres (legacy .postgres entry) in {{ .postgres.namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .postgres.releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .postgres.releaseName "app" $app "env" $env "component" "postgres") | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .postgres.releaseName }}
  targetNamespace: {{ .postgres.namespace }}
  storageNamespace: {{ .postgres.namespace }}
  {{- include "cluster.remediation" $ | nindent 2 }}
  chart:
    spec:
      chart: ./charts/infra/dev-postgres
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .postgres.values | nindent 4 }}
{{- end }}
{{- range .buckets }}
---
# {{ $app }}'s provisioned bucket -> isolated child HelmRelease. A missing provider
# CRD fails this child without wedging the environment umbrella or sibling apps.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .releaseName "app" $app "env" $env "component" "storage") | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .releaseName }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
  {{- include "cluster.appRemediation" (dict "env" $env) | nindent 2 }}
  chart:
    spec:
      chart: ./charts/infra/managed-resource
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    resource:
      {{- toYaml .resource | nindent 6 }}
{{- end }}
{{- end }}
