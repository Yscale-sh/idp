{{- $env := .Values.env -}}
{{- range .Values.apps }}
---
# app: {{ .name }} -> its own HelmRelease (chart ./charts/app) in {{ .namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .name "app" .name "env" $env "component" (.component | default "app")) | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .releaseName }}
  targetNamespace: {{ .namespace }}
  storageNamespace: {{ .namespace }}
  {{- include "cluster.remediation" . | nindent 2 }}
  chart:
    spec:
      chart: ./charts/app
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .values | nindent 4 }}
{{- if and .postgres .postgres.enabled }}
---
# {{ .name }}'s dedicated dev Postgres -> its own HelmRelease in {{ .postgres.namespace }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .postgres.releaseName }}
  namespace: {{ $.Values.source.namespace }}
  labels:
    {{- include "cluster.appLabels" (dict "name" .postgres.releaseName "app" .name "env" $env "component" "postgres") | nindent 4 }}
spec:
  interval: 10m
  releaseName: {{ .postgres.releaseName }}
  targetNamespace: {{ .postgres.namespace }}
  storageNamespace: {{ .postgres.namespace }}
  {{- include "cluster.remediation" . | nindent 2 }}
  chart:
    spec:
      chart: ./charts/infra/dev-postgres
      sourceRef:
        {{- include "cluster.gitSourceRef" $ | nindent 8 }}
      reconcileStrategy: Revision
  values:
    {{- toYaml .postgres.values | nindent 4 }}
{{- end }}
{{- end }}
