{{- /*
Per-app log retention -> Loki runtime overrides. Each app's deploy.yaml may set
logging.retention ("90d", "12h"); the renderer carries it into the umbrella as
values.logging.retention, and this template aggregates every set value into ONE
ConfigMap of per-namespace retention_stream overrides. Loki live-reloads it via
runtime_config (see infrastructure/onprem/logging — the volume is optional, so
Loki runs fine when no app declares a retention). Tenant key "fake" = the
single-tenant id Loki uses with auth_enabled: false. Apps without a retention
fall to the env default (limits_config.retention_period, 30d).
*/}}
{{- $entries := list }}
{{- range .Values.apps }}
{{- $ret := dig "logging" "retention" "" (.values | default dict) }}
{{- if $ret }}
{{- $entries = append $entries (dict "ns" .namespace "period" $ret) }}
{{- end }}
{{- end }}
{{- if $entries }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-runtime-overrides
  namespace: {{ if .Values.logging }}{{ .Values.logging.overridesNamespace | default "loki" }}{{ else }}loki{{ end }}
  labels:
    platform/env: {{ .Values.env }}
    platform/managed-by: platformctl
data:
  overrides.yaml: |
    overrides:
      fake:
        retention_stream:
{{- range $entries }}
          - selector: '{namespace="{{ .ns }}"}'
            priority: 10
            period: {{ .period }}
{{- end }}
{{- end }}
