{{- if .Values.serviceMonitor.enabled -}}
{{/*
ServiceMonitor for the homelab kube-prometheus-stack. The extra
`release: <releaseLabel>` label (default "prometheus") is REQUIRED for the stack
to discover this monitor — without it Prometheus ignores the object.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.releaseLabel | default "prometheus" | quote }}
spec:
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.serviceMonitor.port | default "http" | quote }}
      path: {{ .Values.serviceMonitor.path | default "/metrics" }}
      interval: {{ .Values.serviceMonitor.interval | default "30s" }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end -}}
