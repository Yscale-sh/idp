{{- /*
Vertical Pod Autoscaler for this app (sizing.autosize). Rendered only when
autosize.enabled — apps that don't opt in get no VPA and behave exactly as before.
Requires the cluster `vpa` module (the VPA controller + CRDs). The VPA sizes the
Deployment's requests from observed usage so they stop being hand-tuned:
  mode Off     -> recommend only (read `kubectl describe vpa`)
  mode Initial -> apply at pod creation, no mid-life eviction
  mode Auto    -> evict + recreate to apply new requests as usage shifts
*/ -}}
{{- if .Values.autosize.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "app.fullname" . }}
  updatePolicy:
    updateMode: {{ .Values.autosize.mode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: '*'
        controlledResources: {{ .Values.autosize.controlledResources | toJson }}
        {{- with .Values.autosize.minAllowed }}
        minAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.autosize.maxAllowed }}
        maxAllowed:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
