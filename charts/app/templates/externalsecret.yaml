{{- if and .Values.externalSecret.enabled (eq .Values.externalSecret.backend "ssm") -}}
{{/*
ExternalSecret (external-secrets.io/v1). Materializes the runtime Secret
<app>-runtime that the Deployment envFroms. NO literal secret values appear here.

This path is the SSM/cloud backend ONLY. The dev/on-prem (backend=local) path is
operator-free: it renders a plain Kubernetes Secret in templates/secret.yaml so an
app boots with no external-secrets operator installed. Per-environment backend is
set by idpctl from the target env (NOT deploy.yaml):
  backend=ssm   -> prod/cloud: AWS SSM via external-secrets (storeRef -> the env's
                   SSM ClusterSecretStore, e.g. platform-ssm).
  backend=local -> dev/on-prem: plain Secret (templates/secret.yaml); NOT here.

  dataFrom   pulls the whole app SSM root (/apps/<app>/<env>) into the Secret.
  remoteRefs pin individual keys, including shared groups (/shared/<group>/*).

apiVersion: v1beta1 — the pinned external-secrets (0.14.4) serves v1alpha1+v1beta1,
NOT v1 (verified on dev+prod). v1beta1 is the storage version and matches the
pullsecret + cnpg-db ExternalSecrets. Bump back to v1 only when the external-secrets
module is bumped to a v1-serving release (0.15+); until then v1 fails the install
with "no matches for kind ExternalSecret in version external-secrets.io/v1".
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "externalSecret.storeRef.name is required when externalSecret.enabled (the env's SecretStore/ClusterSecretStore)" .Values.externalSecret.storeRef.name }}
    kind: {{ .Values.externalSecret.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "app.secretName" . }}
    creationPolicy: Owner
  {{- with .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.externalSecret.remoteRefs }}
  data:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end -}}
