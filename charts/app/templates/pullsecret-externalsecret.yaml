{{- /*
Registry pull-secret ExternalSecret: materializes the registry dockerconfigjson
from the env's secrets backend into THIS app's namespace. Replaces the old
cluster-side ClusterExternalSecret that tracked app namespaces by name — every
rendered app now provisions its own pull secret next to its runtime secret.
*/}}
{{- if and .Values.pullSecret .Values.pullSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.pullSecret.name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.pullSecret.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .Values.pullSecret.storeRef.name }}
    kind: {{ .Values.pullSecret.storeRef.kind }}
  target:
    name: {{ .Values.pullSecret.name }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.pullSecret.remoteKey }}
{{- end }}
