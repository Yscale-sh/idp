apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        # Rollout stamp: changing DEPLOY_TIME forces a new ReplicaSet so each
        # render rolls the pods even when the image tag is unchanged.
        platform/deploy-time: {{ .Values.env.tierA.DEPLOY_TIME | default "" | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          # ── env ──────────────────────────────────────────────────────────
          # Tier-A platform vars are injected inline. PORT mirrors the container
          # port. IMAGE_NAME is intentionally NOT injected (Helm sets the image).
          env:
            {{- range $k, $v := .Values.env.tierA }}
            {{- if eq $k "PORT" }}
            - name: PORT
              value: {{ $.Values.port | quote }}
            {{- else }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env.extra }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /*
            Data-store URLs (ENV.md Tier D). Each db/cache contributes its env-var
            keys (the first/default entry also gets the bare DATABASE_URL/REDIS_URL
            alias). The VALUES live in the runtime Secret <app>-runtime (populated
            for dev by the plain Secret, for prod by the ExternalSecret from SSM),
            so every URL is wired via secretKeyRef — never a literal in the chart.
            This makes db/cache wiring real in the pod for BOTH backends.
            */}}
            {{- range .Values.db }}
            {{- range .urlKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- range .Values.cache }}
            {{- range .urlKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          {{- if .Values.externalSecret.enabled }}
          # Remaining secret env (shared groups + app-level keys: JWT_SECRET,
          # GEMINI_*, S3_*, SENDGRID_*, STRIPE_*) is materialized into the runtime
          # Secret <app>-runtime (dev: plain Secret; prod: ExternalSecret from SSM)
          # and pulled in wholesale via envFrom. No literal secret values live in
          # the chart. The *_URL keys above are also present in this Secret.
          envFrom:
            - secretRef:
                name: {{ include "app.secretName" . }}
          {{- end }}
          # ── probes (derived from port unless paths overridden) ────────────
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- /*
        Platform-injected sidecars (e.g. the cloudflared Cloudflare-Tunnel sidecar
        for public routes). The Go renderer appends fully-formed container specs
        here from rendered values; empty by default so this is a no-op.
        */}}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Platform-injected pod volumes (e.g. the cloudflared tunnel config
      ConfigMap). Empty by default; the Go renderer populates it alongside sidecars. */}}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
