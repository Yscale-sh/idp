apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.keda.enabled }}
  replicas: {{ .Values.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
      annotations:
        # Rollout stamp: changing DEPLOY_TIME forces a new ReplicaSet so each
        # render rolls the pods even when the image tag is unchanged.
        platform/deploy-time: {{ .Values.env.tierA.DEPLOY_TIME | default "" | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "app.name" . }}
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if not .Values.worker }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
              protocol: TCP
          {{- end }}
          # ── env ──────────────────────────────────────────────────────────
          # Tier-A platform vars are injected inline. PORT mirrors the container
          # port. IMAGE_NAME is intentionally NOT injected (Helm sets the image).
          env:
            {{- range $k, $v := .Values.env.tierA }}
            {{- if eq $k "PORT" }}
            - name: PORT
              value: {{ $.Values.port | quote }}
            {{- else }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := .Values.env.extra }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /*
            Data-store URLs (ENV.md Tier D). Each db/cache contributes its env-var
            keys (the first/default entry also gets the bare DATABASE_URL/REDIS_URL
            alias). The VALUES live in the runtime Secret <app>-runtime (populated
            for dev by the plain Secret, for prod by the ExternalSecret from SSM),
            so every URL is wired via secretKeyRef — never a literal in the chart.
            This makes db/cache wiring real in the pod for BOTH backends.
            */}}
            {{- range .Values.db }}
            {{- range .urlKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
            {{- range .Values.cache }}
            {{- range .urlKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "app.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            {{- end }}
          {{- if .Values.externalSecret.enabled }}
          # Remaining secret env (shared groups + app-level keys: JWT_SECRET,
          # GEMINI_*, S3_*, SENDGRID_*, STRIPE_*) is materialized into the runtime
          # Secret <app>-runtime (dev: plain Secret; prod: ExternalSecret from SSM)
          # and pulled in wholesale via envFrom. No literal secret values live in
          # the chart. The *_URL keys above are also present in this Secret.
          envFrom:
            - secretRef:
                name: {{ include "app.secretName" . }}
          {{- end }}
          {{- if not .Values.worker }}
          {{- $pt := .Values.probes.type | default "http" }}
          {{- if ne $pt "none" }}
          # ── probes ({{ $pt }}) — a worker (port 0) has none; tcp = a port-open
          # check for a server with no HTTP health route; http = path probes. ──
          livenessProbe:
            {{- if eq $pt "tcp" }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            {{- if eq $pt "tcp" }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            {{- end }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          {{- end }}
          resources:
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
            limits:
              {{- range $k, $v := .Values.resources.limits }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
              {{- /* extended-resource limits beyond cpu/memory, e.g. gpu.intel.com/i915 */}}
              {{- range $k, $v := .Values.resources.extraLimits }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- /* cloudflared Cloudflare-Tunnel sidecar for public routes — rendered
        when the renderer set tunnel.enabled (a prod app with a public route).
        Exposure with NO LoadBalancer. Tears down automatically when the route goes
        private or the app is removed (Helm/Flux prune the whole pod spec). */}}
        {{- if .Values.tunnel.enabled }}
        {{- include "app.cloudflaredSidecar" . | nindent 8 }}
        {{- end }}
        {{- /* Tailscale egress sidecar — rendered when the renderer set
        tailscale.enabled (a non-local/prod app that declared tailscaleEgress) so
        the app can reach out-of-cluster services with no in-cluster DNS, e.g. the
        on-prem Loki for log shipping. Userspace tailscaled; no host privileges. */}}
        {{- if .Values.tailscale.enabled }}
        {{- include "app.tailscaleSidecar" . | nindent 8 }}
        {{- end }}
        {{- /* General extension point for any other platform-injected containers;
        the Go renderer appends fully-formed specs here. Empty by default → no-op. */}}
        {{- with .Values.sidecars }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Platform-injected pod volumes (e.g. the cloudflared tunnel config
      ConfigMap). Empty by default; the Go renderer populates it alongside sidecars. */}}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
