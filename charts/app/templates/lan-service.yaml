{{/*
LAN expose — the ON-PREM twin of the Cloudflare Tunnel.

On the on-prem backend there is no tunnel, so an app that must be reachable from
the LAN (e.g. a media UI) gets a MetalLB LoadBalancer. This is a SEPARATE Service
from the ClusterIP one above and is rendered ONLY when the renderer set
lanExpose.enabled (app opted in via expose.lan on a local backend). It is the only
sanctioned LoadBalancer — the no-LB serviceTypeGuard still protects the app
Service, and the platform policy only permits THIS template's LB.

NOT rendered for prod (Cloudflare Tunnel is the exposure there) or for workers.
*/}}
{{- if and .Values.lanExpose .Values.lanExpose.enabled (not .Values.worker) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" . }}-lan
  labels:
    {{- include "app.labels" . | nindent 4 }}
    platform/expose: lan
  {{- if or .Values.lanExpose.ip .Values.lanExpose.pool .Values.lanExpose.host }}
  annotations:
    {{- with .Values.lanExpose.ip }}
    metallb.universe.tf/loadBalancerIPs: {{ . | quote }}
    {{- end }}
    {{- /* address-pool lets MetalLB auto-pick a free IP from a named pool even
        when the pool runs autoAssign: false (the platform default). */}}
    {{- with .Values.lanExpose.pool }}
    metallb.universe.tf/address-pool: {{ . | quote }}
    {{- end }}
    {{- /* the cluster ExternalDNS publishes <host> -> this LB's VIP into the LAN
        resolver (AdGuard), giving the app a real name instead of a bare IP. */}}
    {{- with .Values.lanExpose.host }}
    external-dns.alpha.kubernetes.io/hostname: {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  ports:
    - name: http
      port: {{ .Values.lanExpose.port | default .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "app.selectorLabels" . | nindent 4 }}
{{- end }}
