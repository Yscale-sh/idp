{{- range .Values.storage }}
{{/*
One ExternalSecret per profile-backed bucket, holding ONLY that bucket's key
pair as <PREFIX>_ACCESS_KEY_ID / <PREFIX>_SECRET_ACCESS_KEY. The Deployment
envFroms it alongside the app runtime Secret.

Why separate, rather than folding these keys into <app>-runtime: the credentials
belong to the ENVIRONMENT's storage profile, not to the app's secret root, and
keeping one Secret per bucket means a bucket's credentials are scoped to that
bucket. The bucket name, endpoint, region and addressing style are NOT secret
and stay in plain env.

apiVersion v1beta1 matches the app runtime + pullsecret ExternalSecrets (the
pinned external-secrets 0.14.4 serves v1alpha1+v1beta1, not v1).
*/}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .secretName }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
    platform/storage: {{ .name }}
spec:
  refreshInterval: {{ .credentials.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "storage[].credentials.storeRef.name is required" .credentials.storeRef.name }}
    kind: {{ .credentials.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ .secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .prefix }}_ACCESS_KEY_ID
      remoteRef:
        key: {{ required "storage[].credentials.accessKeyID.key is required" .credentials.accessKeyID.key }}
        {{- with .credentials.accessKeyID.property }}
        property: {{ . }}
        {{- end }}
    - secretKey: {{ .prefix }}_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ required "storage[].credentials.secretAccessKey.key is required" .credentials.secretAccessKey.key }}
        {{- with .credentials.secretAccessKey.property }}
        property: {{ . }}
        {{- end }}
{{- end }}
