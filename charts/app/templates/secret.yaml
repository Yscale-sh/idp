{{- if and .Values.externalSecret.enabled (eq .Values.externalSecret.backend "local") -}}
{{/*
Plain Kubernetes Secret <app>-runtime for the DEV / on-prem (backend=local) path.

This is the operator-free dev backend: it does NOT depend on the external-secrets
operator (in dev the external-secrets module ships enabled:false), so the runtime
Secret always materializes and the pod can start. The prod/cloud path instead uses
templates/externalsecret.yaml (backend=ssm) to pull real values from AWS SSM.

What this Secret carries in dev:
  - DB/cache connection URLs (DATABASE_URL / PRIMARY_DATABASE_URL / REDIS_URL / ...)
    assembled by the renderer from the in-cluster dev store (db.connection.url).
    DATABASE_URL points at the platform dev Postgres service — this is what
    repoints carshowdb off the dead Supabase pooler onto in-cluster Postgres.
  - Clearly-marked DEV PLACEHOLDER values for app-level keys (JWT_SECRET, GEMINI_*,
    S3_*, SENDGRID_*, STRIPE_*) so the app can BOOT in dev. These are NEVER real
    secrets; prod supplies the real values from SSM via the ExternalSecret.

The Deployment wires the *_URL keys via secretKeyRef and envFroms the rest.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.secretName" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    platform/secret-backend: local
    platform/secret-note: "dev placeholders + in-cluster dev DB URL; not real secrets"
type: Opaque
stringData:
  {{- /* Data-store connection URLs (real, in-cluster dev endpoints). */}}
  {{- range .Values.db }}
  {{- $url := "" }}
  {{- with .connection }}{{ $url = .url }}{{- end }}
  {{- range .urlKeys }}
  {{ . }}: {{ $url | quote }}
  {{- end }}
  {{- end }}
  {{- range .Values.cache }}
  {{- $url := "" }}
  {{- with .connection }}{{ $url = .url }}{{- end }}
  {{- range .urlKeys }}
  {{ . }}: {{ $url | quote }}
  {{- end }}
  {{- end }}
  {{- /*
  Dev placeholders for app-level secret keys so carshowdb-class apps boot in dev.
  Marked "dev-placeholder" so nobody mistakes them for real credentials. Prod
  overrides every one of these from SSM (backend=ssm renders the ExternalSecret
  instead of this Secret, so these placeholders never reach prod).
  */}}
  {{- range .Values.devSecretPlaceholders }}
  {{ .name }}: {{ .value | default "dev-placeholder" | quote }}
  {{- end }}
{{- end -}}
