# cnpg-db — LEAN CloudNativePG: small HA + WAL/base → R2 PITR. Overridable from
# environments/<env>/cluster.yaml (modules.cnpg-db.values).

clusterName: prod-pg
instances: 2                        # primary + 1 replica (HA). Minimal; bump only if needed.

postgresImage: ghcr.io/cloudnative-pg/postgresql:16.4

# Pull secret(s) for a private operand image. Empty for the public CNPG operands;
# prod sets [ghcr-pull] because postgresImage is our private ghcr postgis+pgvector bake.
imagePullSecrets: []

# ghcr pull-secret sync into THIS namespace (for a private postgresImage). Disabled by
# default (public operands need none); prod enables it + names the SSM dockerconfigjson.
ghcrPull:
  enabled: false
  secretName: ghcr-pull
  remoteKey: /homelab/ghcr/pull-dockerconfigjson

# ── lean footprint (small DBs) ────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
# Low-memory Postgres tuning so it sits comfortably on small nodes.
parameters:
  shared_buffers: 64MB
  max_connections: "50"
  max_slot_wal_keep_size: 1GB      # cap WAL growth (the disk-incident fix)

storage:
  size: 5Gi
  className: local-path            # dev default; prod overrides to linode-block-storage

# Per-app databases + login roles (created at init). Passwords + the app
# DATABASE_URL are wired at cutover (Gate C), not here.
databases:
  - name: carshowdb
    owner: carshowdb
  - name: cartogopher
    owner: cartogopher

# Declarative login roles + passwords (CNPG managed.roles). Each entry needs an SSM
# parameter holding a JSON blob {"username":"<role>","password":"<pw>"} that ESO
# `extract`s into a basic-auth Secret <role>-pg-auth. Use for any role whose password
# must be GitOps-provisioned (no hand ALTER ROLE) or whose app onboarded AFTER initdb
# (managed.roles creates it; postInitSQL can't). Roles NOT listed are left untouched
# (e.g. ones with a hand-set password). Empty by default.
managedRoles: []
#  - name: cartogopher
#    passwordParam: /apps/cartogopher/prod/PG_AUTH

# ── backups: continuous WAL + daily base → R2 (barman; no CSI needed) ──────────
backup:
  retention: "14d"
  schedule: "0 0 3 * * *"          # 6-field CNPG cron → 03:00 daily base
  r2:
    destinationPath: s3://prod-dr/pg/prod-pg
    endpointURL: https://R2-ACCOUNT-ID.r2.cloudflarestorage.com
    secretName: cnpg-r2

externalSecrets:
  storeRef:
    name: homelab-ssm              # dev; prod overrides to platform-ssm
    kind: ClusterSecretStore
  refreshInterval: 1h
  r2AccessKeyParam: /shared/cloudflare/r2-access-key-id
  r2SecretKeyParam: /shared/cloudflare/r2-secret-access-key

# ── backup-monitor: the "are we actually backed up?" tripwire ─────────────────
monitor:
  enabled: true
  schedule: "0 8 * * *"
  maxAgeHours: 26
  image: bitnami/kubectl:1.31
