{{- /* R2 creds for CNPG's WAL archiving (barman). Same shared R2 keys the etcd
   snapshots + Velero + Loki use, pulled from SSM into the CNPG namespace. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.backup.r2.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: idp
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.backup.r2.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: {{ .Values.externalSecrets.r2AccessKeyParam }}
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.r2SecretKeyParam }}
