{{- if .Values.externalSecrets.enabled }}
{{- $es := .Values.externalSecrets }}
# Build credentials materialized from the secrets backend. Secret names/keys are
# the internal/builder Job-template contract (ghcr-push/.dockerconfigjson holds
# push auth for YOUR registry — the name is historical, not a ghcr requirement).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ghcr-push
  labels:
    {{- include "image-builder.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ required "externalSecrets.storeRef.name is required when externalSecrets.enabled" $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    name: ghcr-push
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ required "externalSecrets.remoteKeys.dockerconfigjson is required when externalSecrets.enabled" $es.remoteKeys.dockerconfigjson }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: git-token
  labels:
    {{- include "image-builder.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeRef.name }}
    kind: {{ $es.storeRef.kind }}
  target:
    name: git-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ required "externalSecrets.remoteKeys.gitToken is required when externalSecrets.enabled" $es.remoteKeys.gitToken }}
{{- end }}
