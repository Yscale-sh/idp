{{/*
The S3 key pair the provisioner Job authenticates with. This is an ORDINARY
(non-hook) resource so Helm applies it in the main phase, before the
post-install/post-upgrade hook Job runs.

apiVersion v1beta1 matches the rest of the platform's ExternalSecrets (the
pinned external-secrets 0.14.4 serves v1alpha1+v1beta1, not v1).
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "bucketProvisioner.secretName" . }}
  labels:
    {{- include "bucketProvisioner.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.credentials.refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ required "credentials.storeRef.name is required (the env's SecretStore/ClusterSecretStore)" .Values.credentials.storeRef.name }}
    kind: {{ .Values.credentials.storeRef.kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "bucketProvisioner.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: {{ required "credentials.accessKeyID.key is required" .Values.credentials.accessKeyID.key }}
        {{- with .Values.credentials.accessKeyID.property }}
        property: {{ . }}
        {{- end }}
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: {{ required "credentials.secretAccessKey.key is required" .Values.credentials.secretAccessKey.key }}
        {{- with .Values.credentials.secretAccessKey.property }}
        property: {{ . }}
        {{- end }}
