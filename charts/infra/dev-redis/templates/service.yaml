apiVersion: v1
kind: Service
metadata:
  name: {{ include "dev-redis.fullname" . }}
  labels:
    {{- include "dev-redis.labels" . | nindent 4 }}
spec:
  # ClusterIP is hardcoded by design — dev-redis must never be a LoadBalancer
  # (platform guardrail; there is intentionally no service.type value).
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.service.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "dev-redis.selectorLabels" . | nindent 4 }}
