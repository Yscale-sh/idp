{{- if not .Values.auth.existingSecret }}
{{- $password := include "dev-postgres.password" . -}}
{{- $host := include "dev-postgres.fullname" . -}}
{{- $port := .Values.service.port | toString -}}
{{- $db := .Values.auth.database -}}
{{- $user := .Values.auth.username -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dev-postgres.fullname" . }}
  labels:
    {{- include "dev-postgres.labels" . | nindent 4 }}
  annotations:
    # Preserve the generated password across `helm upgrade` so the data volume
    # keeps matching the credentials. The _helpers lookup also reuses it.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  POSTGRES_DB: {{ $db | quote }}
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_HOST: {{ $host | quote }}
  POSTGRES_PORT: {{ $port | quote }}
  # DATABASE_URL-compatible connection string the app chart wires into apps as
  # DATABASE_URL / <NAME>_DATABASE_URL (ENV.md Tier D). sslmode=disable for the
  # in-cluster dev box (traffic stays on the cluster network).
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%s/%s?sslmode=disable" $user $password $host $port $db | quote }}
{{- end }}
