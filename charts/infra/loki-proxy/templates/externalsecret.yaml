{{- /* TS_AUTHKEY for the tailscale egress node, from the env SecretStore (SSM). */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loki-proxy-ts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: idp
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: loki-proxy-ts
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: {{ .Values.externalSecrets.authKeyParam }}
