{{- /* Build Velero's `cloud` credentials file (AWS INI format) from the shared R2
   keys in SSM. The {{ `{{ ... }}` }} bits are ESO v2 templates emitted literally —
   Helm renders the backtick raw string, external-secrets fills .accessKey/.secretKey
   at sync time. Result: secret velero-r2 with a single `cloud` key. */}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: idp
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.storeRef.name }}
    kind: {{ .Values.storeRef.kind }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id={{ `{{ .accessKey }}` }}
          aws_secret_access_key={{ `{{ .secretKey }}` }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: {{ .Values.r2AccessKeyParam }}
    - secretKey: secretKey
      remoteRef:
        key: {{ .Values.r2SecretKeyParam }}
