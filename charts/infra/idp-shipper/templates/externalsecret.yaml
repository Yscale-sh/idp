{{- if .Values.cloudflare.enabled }}
# ExternalSecret materializing CLOUDFLARE_API_TOKEN into the shipper's release
# namespace from the cluster-ssm ClusterSecretStore (the same store the
# platform uses for R2 and other shared Cloudflare credentials).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: idp-shipper-cf-token
  labels:
    {{- include "idp-shipper.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.cloudflare.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.cloudflare.secretStoreRef.name }}
    kind: {{ .Values.cloudflare.secretStoreRef.kind }}
  target:
    name: idp-shipper-cf-token
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: {{ .Values.cloudflare.secretRemoteKey }}
{{- end }}
