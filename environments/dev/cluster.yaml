# environments/dev/cluster.yaml — reference DEV environment definition.
#
# This is a working SKELETON a fork edits in place. Parsed by internal/clusterenv
# (clusterenv.Config). Keep keys in lockstep with that struct: env,
# secrets{backend,storeRef,refreshInterval}, observability, zones[],
# resourceBounds, allowMutableTags, domain, flux{}, modules{}.
#
# The dev environment models an on-prem / LAN cluster (k3s or similar): local
# secrets, no Cloudflare Tunnel, mutable image tags allowed for fast iteration.
# Enabled modules MUST carry source/chart/version inline because
# clusterenv.Validate reads them here; disabled modules stay terse.

env: dev

# ── secrets backend (per CONVENTIONS.md §4) ──────────────────────────────────
# dev/on-prem => LOCAL: external-secrets Kubernetes provider (or a plain
# in-cluster Secret for quick dev). The app chart's externalSecret.storeRef
# points at this store; backend=local is injected by the renderer from this env.
secrets:
  backend: local
  storeRef:
    name: platform-local
    kind: ClusterSecretStore        # cluster-wide local SecretStore (Kubernetes provider)
  refreshInterval: 1h
  # Registry pull secret: the app chart renders an ExternalSecret per app
  # namespace. Point remoteKey at wherever YOUR registry credential lives.
  imagePull:
    secretName: ghcr-pull
    remoteKey: /your-org/ghcr/pull-dockerconfigjson
    storeRef:
      name: platform-local
      kind: ClusterSecretStore

# ── object-storage provisioning profiles (optional) ──────────────────────────
# One entry per deploy.yaml storage type (r2 | s3). An app that sets
# `storage[].provision: true` needs a matching entry here; without one the
# render FAILS before touching Git. Buckets are created by
# charts/infra/bucket-provisioner through the S3 API, so the same shape serves
# MinIO, Cloudflare R2 and AWS S3 — only endpoint/region/pathStyle differ.
#
# NOTHING SECRET LIVES HERE. `credentials` names the store and the remote keys;
# external-secrets resolves the values in-cluster. `image` must be
# digest-pinned — the provisioner Job holds credentials for every bucket on the
# endpoint, so a mutable tag would let a re-pull change what runs with them.
#
# PLACEHOLDERS ONLY in this published sample: replace the endpoint, the store
# name, the remote keys, and the image digest with your own. Adding an `r2:`
# entry moves the DEFAULT storage type onto the profile path — every r2 bucket
# then takes its credentials from the store named there rather than the legacy
# shared Cloudflare group, so do it deliberately.
storageProfiles:
  s3:
    endpoint: https://minio.example.invalid   # your S3-compatible endpoint
    pathStyle: true                           # MinIO/on-prem addressing
    namespace: platform-storage               # where the provisioner Job runs
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    credentials:
      storeRef:
        name: platform-local
        kind: ClusterSecretStore
      refreshInterval: 1h
      # With the ESO Kubernetes provider, `key` is a Secret name and `property`
      # selects the entry inside it.
      accessKeyID:
        key: example-object-storage
        property: ACCESS_KEY_ID
      secretAccessKey:
        key: example-object-storage
        property: SECRET_ACCESS_KEY

# ── observability endpoints (injected as Tier-A env into every app) ──────────
observability:
  lokiURL: http://loki.loki.svc.cluster.local:3100
  consoleLogging: true

# ── approved route zones (host policy guardrail) ─────────────────────────────
# A route host outside these zones is a policy error (fail before mutating).
zones:
  - carshowdb.local
  - "*.local"

# ── seams this env provides (the rest derive) ────────────────────────────────
# dev has no Cloudflare Tunnel, so publicRoutes (the tunnel ingress path) stays
# off — a deploy.yaml route with public:true is fulfilled on-prem by a LAN
# LoadBalancer (the lanExpose seam, on by default) instead of a tunnel.
seams:
  publicRoutes: false

# ── policy knobs ─────────────────────────────────────────────────────────────
# dev tolerates mutable image tags (:latest) for fast iteration; prod never does.
allowMutableTags: true
resourceBounds:
  maxCPU: "8"
  maxMemory: 16Gi

domain: svc.cluster.local

# MetalLB IPAddressPool the renderer auto-assigns a LAN LoadBalancer IP from
# when an app exposes a public route here. Set to your pool's name
# (kubectl -n metallb-system get ipaddresspools).
lanPool: pool-default

# ── Flux wiring (HelmReleases reference the GitRepository source here) ────────
# repoURL/branch tell the FluxInstance which repo+branch to sync — point them at
# YOUR fork of this platform repo.
flux:
  namespace: flux-system
  sourceName: flux-system
  repoURL: https://github.com/yscale-sh/idp.git
  branch: main

# ── module enable matrix + per-env values ────────────────────────────────────
# source/chart/version mirror modules/registry.yaml (the catalog). This skeleton
# enables the minimum useful set; see modules/registry.yaml for everything else
# (velero, cnpg, image-builder, idp-shipper, github-runners, loki, vpa, ...).
modules:
  keda:
    enabled: true
    source: chartRepo
    chart: keda
    repoURL: https://kedacore.github.io/charts
    version: 2.17.2
    namespace: keda

  external-secrets:
    enabled: true                   # ESO: materializes remote params -> k8s Secrets
    source: chartRepo
    chart: external-secrets
    repoURL: https://charts.external-secrets.io
    version: 0.14.4
    namespace: external-secrets
    values:
      installCRDs: true

  monitoring:
    enabled: false                  # enable if the cluster doesn't already run one

  cert-manager:
    enabled: false                  # LAN is plain HTTP; no ACME needed in dev

  yscale:
    enabled: false                  # nothing to burst on a LAN cluster
