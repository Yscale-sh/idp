# platform-prod-root — the prod app-of-apps (root Argo CD Application).
#
# Same shape as platform-dev-root, but pointed at environments/prod. This is the
# ONE imperative bootstrap step for the prod environment; after it, Argo CD is the
# only writer and deploying is a git commit.
#
# What it does:
#   source.path = environments/prod  with directory.recurse=true  →  Argo CD watches
#   EVERY rendered Application under environments/prod/ (apps/*.yaml + infra/*.yaml)
#   and fans out to them (app-of-apps):
#
#     platform-prod-root
#       ├─ environments/prod/infra/*.yaml  (enabled module Applications)
#       └─ environments/prod/apps/*.yaml   (per-app Applications)
#
#   A new app/module is one new rendered file under environments/prod/; this root
#   auto-discovers it. No edit to this file is needed to add apps.
#
# Bootstrap (operator, once):
#   kubectl apply -n argocd -f argocd/platform-prod-root.yaml
#
# NOTE: targetRevision is pinned to a release tag for prod (not HEAD) so prod only
# moves when you deliberately cut a platform release. Change the tag to roll prod.
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-prod-root
  namespace: argocd
  labels:
    platform/managed-by: platformctl
    platform/env: prod
    platform/role: root
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # THIS repo. Placeholder URL — replace with the real remote before bootstrapping
    # prod. Register it with Argo CD (`argocd repo add <url>`) if it is private.
    repoURL: https://github.com/jakenesler/platformctl
    # Prod is pinned to a release tag (e.g. v1) rather than HEAD so prod is only
    # updated by an explicit retag/bump. Set this to your platform release ref.
    targetRevision: v1
    path: environments/prod
    directory:
      recurse: true
      include: '{apps/*.yaml,infra/*.yaml}'
      exclude: 'cluster.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
