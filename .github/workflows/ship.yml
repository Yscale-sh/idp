# Reusable JDP ship workflow. An app repo calls this (uses: jakenesler/jdp/.github/
# workflows/ship.yml@v1) and the platform does the rest: build + push the app image,
# render its deploy.yaml into the env umbrella (clusters/<env>/platform.yaml) in the
# jdp repo, and commit it — Flux then reconciles. Teardown (inputs.remove=true)
# removes the app from the umbrella instead, so Flux prunes it.
#
# The render/remove runs jdpctl via `docker run` (the jdpctl image bundles helm so
# the no-LB guardrail stays at full strength) rather than a job container, so the
# app-image `docker build` works on the host runner without Docker-in-Docker.
name: ship

on:
  workflow_call:
    inputs:
      env:
        description: "Target environment (dev | prod)"
        type: string
        required: true
      deploy-file:
        type: string
        default: deploy.yaml
      jdpctl-tag:
        description: "ghcr.io/jakenesler/jdpctl image tag to run (pin a major, e.g. v1)"
        type: string
        default: v1
      remove:
        description: "Tear down: remove the app from the platform instead of deploying"
        type: boolean
        default: false
      manage-dns:
        description: "Optional: also reconcile Cloudflare DNS for public routes (a proxied CNAME -> the app's tunnel). Off by default — set the domain by hand otherwise. The Cloudflare Tunnel is the exposure either way."
        type: boolean
        default: false
      aws-region:
        description: "AWS region for the SSM-sourced Cloudflare credentials (manage-dns)"
        type: string
        default: us-east-1
      cloudflare-token-ssm-path:
        description: "SSM path of the Cloudflare DNS:Edit API token (manage-dns). Empty => /apps/<app>/<env>/CLOUDFLARE_API_TOKEN"
        type: string
        default: ""
      cloudflare-zone-ssm-path:
        description: "Optional SSM path of the Cloudflare zone id (manage-dns). Lets a single-zone-scoped token skip listing zones. Empty => derive by listing zones"
        type: string
        default: ""
    secrets:
      JDP_APP_ID:
        required: false
      JDP_APP_PRIVATE_KEY:
        required: false
      PLATFORM_REPO_TOKEN:
        required: false
      # manage-dns credentials. Provide CLOUDFLARE_API_TOKEN (+ TUNNEL_TOKEN) directly,
      # OR let the DNS step read them from SSM using one of the AWS credential sets.
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ZONE_ID:
        required: false
      TUNNEL_TOKEN:
        required: false
      AWS_ROLE_ARN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

# Serialize writers to a given env's platform.yaml so concurrent ships don't clobber.
concurrency:
  group: ship-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  ship:
    runs-on: ubuntu-latest
    env:
      JDPCTL_IMAGE: ghcr.io/jakenesler/jdpctl:${{ inputs.jdpctl-tag }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Read app name from deploy.yaml
        id: app
        run: |
          set -euo pipefail
          # Robust to unquoted, "double"- and 'single'-quoted values + trailing comments.
          NAME="$(awk '/^app:/{v=$0; sub(/^app:[[:space:]]*/,"",v); sub(/[[:space:]]*#.*$/,"",v); sub(/[[:space:]]+$/,"",v); gsub(/^["'"'"']|["'"'"']$/,"",v); print v; exit}' "${{ inputs.deploy-file }}")"
          [ -n "$NAME" ] || { echo "could not read 'app:' from ${{ inputs.deploy-file }}" >&2; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/jakenesler/$NAME" >> "$GITHUB_OUTPUT"

      # Prefer a GitHub App (short-lived, repo-scoped) to write the platform repo;
      # fall back to a fine-grained PAT. One of the two must be provided by the caller.
      - name: Mint platform token (GitHub App)
        id: apptoken
        if: ${{ secrets.JDP_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.JDP_APP_ID }}
          private-key: ${{ secrets.JDP_APP_PRIVATE_KEY }}
          owner: jakenesler
          repositories: jdp

      - name: Resolve platform token
        id: tok
        env:
          APP_TOKEN: ${{ steps.apptoken.outputs.token }}
          PAT: ${{ secrets.PLATFORM_REPO_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${APP_TOKEN:-$PAT}"
          [ -n "$TOKEN" ] || { echo "no platform token: pass JDP_APP_ID/JDP_APP_PRIVATE_KEY or PLATFORM_REPO_TOKEN" >&2; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build + push app image (tag = commit sha)
        if: ${{ !inputs.remove }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.app.outputs.image }}:${{ github.sha }}

      - name: Checkout platform repo (jdp) into .platform
        uses: actions/checkout@v4
        with:
          repository: jakenesler/jdp
          path: .platform
          token: ${{ steps.tok.outputs.token }}
          ref: ${{ inputs.env == 'prod' && 'prod' || 'main' }}

      - name: Render (deploy) or remove (teardown) via jdpctl
        run: |
          set -euo pipefail
          docker pull "$JDPCTL_IMAGE"
          if [ "${{ inputs.remove }}" = "true" ]; then
            docker run --rm -v "$PWD":/w -w /w "$JDPCTL_IMAGE" \
              remove --app "${{ steps.app.outputs.name }}" --env "${{ inputs.env }}" --root .platform
          else
            docker run --rm -v "$PWD":/w -w /w "$JDPCTL_IMAGE" \
              render --env "${{ inputs.env }}" --file "${{ inputs.deploy-file }}" \
                     --image "${{ steps.app.outputs.image }}:${{ github.sha }}" \
                     --deploy-time "${{ github.sha }}" --root .platform
          fi

      - name: "Commit platform change (dev push to main; prod PR vs prod branch)"
        working-directory: .platform
        env:
          GH_TOKEN: ${{ steps.tok.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "jdp-ship-bot"
          git config user.email "jdp-ship-bot@users.noreply.github.com"
          if git diff --quiet; then echo "no platform change — nothing to commit"; exit 0; fi
          ACT="deploy"; [ "${{ inputs.remove }}" = "true" ] && ACT="remove"
          MSG="ship(${{ inputs.env }}): $ACT ${{ steps.app.outputs.name }} @ ${GITHUB_SHA::12}"
          git add -A
          git commit -m "$MSG"
          if [ "${{ inputs.env }}" = "prod" ]; then
            BR="ship/${{ steps.app.outputs.name }}-${GITHUB_SHA::12}"
            git checkout -b "$BR"
            git push origin "$BR"
            gh pr create --base prod --head "$BR" --title "$MSG" \
              --body "Automated by ship.yml from ${{ github.repository }}@${{ github.sha }}. Review + merge to release to prod."
          else
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # ── Optional DNS: point the app's PUBLIC hostnames at its Cloudflare Tunnel ──
      # Off unless manage-dns=true. Exposure is ALWAYS the cloudflared sidecar; this
      # only writes a proxied CNAME <host> -> <tunnelID>.cfargotunnel.com so a browser
      # can find the tunnel (the alternative is setting that record by hand). The
      # tunnel id is derived from TUNNEL_TOKEN, so no separate tunnel-id config.
      #
      # Configure AWS creds only when manage-dns is on, no direct CF token was given,
      # and a credential set is present — so the next step can read CF creds from SSM.
      - name: Configure AWS credentials (SSM-sourced Cloudflare creds)
        if: ${{ inputs.manage-dns && secrets.CLOUDFLARE_API_TOKEN == '' && (secrets.AWS_ROLE_ARN != '' || secrets.AWS_ACCESS_KEY_ID != '') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Reconcile DNS (Cloudflare Tunnel routes)
        if: ${{ inputs.manage-dns }}
        env:
          APP: ${{ steps.app.outputs.name }}
          ENVN: ${{ inputs.env }}
          GH_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TUNNEL_TOKEN: ${{ secrets.TUNNEL_TOKEN }}
          GH_CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN_SSM_PATH: ${{ inputs.cloudflare-token-ssm-path }}
          CF_ZONE_SSM_PATH: ${{ inputs.cloudflare-zone-ssm-path }}
        run: |
          set -euo pipefail
          # Cloudflare API token: a direct secret wins; otherwise read it from SSM
          # (reusing existing prod creds). Default path mirrors the TUNNEL_TOKEN one.
          CF_TOKEN="${GH_CF_TOKEN:-}"
          if [ -z "$CF_TOKEN" ]; then
            P="${CF_TOKEN_SSM_PATH:-/apps/$APP/$ENVN/CLOUDFLARE_API_TOKEN}"
            CF_TOKEN="$(aws ssm get-parameter --with-decryption --name "$P" --query 'Parameter.Value' --output text)"
          fi
          [ -n "$CF_TOKEN" ] || { echo "manage-dns: no CLOUDFLARE_API_TOKEN (set the secret or provision it in SSM)" >&2; exit 1; }
          echo "::add-mask::$CF_TOKEN"
          # Tunnel token (to derive the tunnel id): a direct secret wins, else SSM.
          TUN="${GH_TUNNEL_TOKEN:-}"
          if [ -z "$TUN" ]; then
            TUN="$(aws ssm get-parameter --with-decryption --name "/apps/$APP/$ENVN/TUNNEL_TOKEN" --query 'Parameter.Value' --output text || true)"
          fi
          [ -n "$TUN" ] || { echo "manage-dns: no TUNNEL_TOKEN to derive the tunnel id (set the secret or provision /apps/$APP/$ENVN/TUNNEL_TOKEN)" >&2; exit 1; }
          echo "::add-mask::$TUN"
          # Zone id (optional): lets a single-zone-scoped DNS:Edit token skip listing
          # zones. Direct secret wins; else SSM if a path was given; else empty (the
          # token must then have zone:read so jdpctl can look the zone up).
          ZID="${GH_CF_ZONE_ID:-}"
          if [ -z "$ZID" ] && [ -n "${CF_ZONE_SSM_PATH:-}" ]; then
            ZID="$(aws ssm get-parameter --with-decryption --name "$CF_ZONE_SSM_PATH" --query 'Parameter.Value' --output text || true)"
          fi
          CMD="sync"; [ "${{ inputs.remove }}" = "true" ] && CMD="prune"
          docker pull "$JDPCTL_IMAGE" >/dev/null
          docker run --rm -v "$PWD":/w -w /w \
            -e CLOUDFLARE_API_TOKEN="$CF_TOKEN" -e TUNNEL_TOKEN="$TUN" -e CLOUDFLARE_ZONE_ID="$ZID" \
            "$JDPCTL_IMAGE" dns "$CMD" --file "${{ inputs.deploy-file }}" --env "$ENVN"
