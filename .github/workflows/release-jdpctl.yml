# Build + publish the jdpctl container image (ghcr.io/jakenesler/jdpctl) used by the
# reusable ship workflow. Triggered on version tags (v*) and published releases, so
# app callers can pin `jdpctl-tag: v1` and get a stable, centrally-bumped image.
name: release-jdpctl

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: release-jdpctl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jakenesler/jdpctl
          # v1.2.3 -> tags 1.2.3, 1.2, 1, plus the raw tag + sha. Callers pin `v1`
          # (the major) so a jdpctl change can't silently alter every app's render.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
