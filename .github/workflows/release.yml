name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IDP_CI_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install pinned analysis tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          curl -fsSLo "$RUNNER_TEMP/shellcheck.tar.gz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$(go env GOPATH)/bin/shellcheck"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Workflow lint
        run: actionlint .github/workflows/*.yml
      - name: Full strict gate
        run: make ci-local

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/idpctl" >> "$GITHUB_ENV"
      - name: Build reproducible CLI archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if [ "$os" = "windows" ]; then suffix=".exe"; fi
            name="idpctl_${VERSION}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/idpctl${suffix}" ./cmd/idpctl
            tar --sort=name --mtime='UTC 1970-01-01' \
              --owner=0 --group=0 --numeric-owner \
              -C dist -cf - "idpctl${suffix}" \
              | gzip -n > "dist/${name}.tar.gz"
            rm "dist/idpctl${suffix}"
          done
          go list -m -json all > dist/go-modules.json
          (cd dist && sha256sum -- ./*.tar.gz go-modules.json > checksums.txt)
      - name: Attest CLI release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/go-modules.json
            dist/checksums.txt
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push multi-architecture image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Install pinned GitHub CLI
        env:
          GH_VERSION: 2.98.0
          GH_LINUX_AMD64_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
        run: |
          set -euo pipefail
          archive="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/$archive"
          echo "${GH_LINUX_AMD64_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin/gh" \
            "$RUNNER_TEMP/gh"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "IDP ${{ github.ref_name }}"
      - name: Record immutable image digest
        run: echo "${IMAGE_NAME}@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
