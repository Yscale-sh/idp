# Build + push the idpctl image (the idp-shipper runs from this same image).
# Manual (workflow_dispatch) so the production :v2 tag is only rebuilt deliberately,
# not on every commit. Runs on an amd64 ubuntu runner — native build, no QEMU
# (the cluster nodes are all amd64; a local arm64 build would crash the shipper).
#
# Auth: pushes via the built-in GITHUB_TOKEN (packages: write). If the existing
# ghcr 'idpctl' package isn't linked to this repo, the push 403s — fix once in the
# package's "Manage Actions access" settings (grant JakeNesler/idp Write), re-run.
name: build-idpctl-image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build + push (the shipper tracks :v2)"
        required: true
        default: v2

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/jakenesler/idpctl:${{ inputs.tag }}
          provenance: false
