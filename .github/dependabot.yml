version: 2
updates:
  # Go module dependencies (cobra, sigs.k8s.io/yaml, ...).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns: ["*"]
  # Pinned GitHub Actions (keeps action versions current + lets us move to SHAs).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The idpctl image base + tooling in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Keep patch releases flowing for pinned build/runtime images (including the
    # Go 1.25 toolchain), while minor/major jumps remain deliberate upgrades.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
